# nginx inside the frontend container: serves the built single-page app.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Files under /assets/ have a fingerprint in their name (index-B8NM45Hl.js),
    # so a changed file always gets a new name. Browsers may keep them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API calls never belong to this container: the host nginx sends /api to
    # the backend. If one arrives here anyway, answer 404 instead of letting
    # the app-page fallback below reply with index.html and a 200.
    location /api/ {
        return 404;
    }

    # Everything else: serve the file if it exists, otherwise hand back
    # index.html and let the app's own routing decide what to show
    # (so deep links like /some/page work instead of returning 404).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
