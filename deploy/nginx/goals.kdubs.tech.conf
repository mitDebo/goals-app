# Host nginx site for goals-app on the droplet (same layout as raffle.kdubs.tech).
# Install to /etc/nginx/sites-available/goals.kdubs.tech, symlink into sites-enabled.
# The certificate is obtained separately with `certbot certonly`, so certbot
# never edits this file.
#
#   /api/...  -> backend container   (127.0.0.1:8110)
#   /...      -> frontend container  (127.0.0.1:8111)

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name goals.kdubs.tech;

    ssl_certificate     /etc/letsencrypt/live/goals.kdubs.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goals.kdubs.tech/privkey.pem;
    include snippets/ssl-common.conf;

    # 127.0.0.1 rather than "localhost": the containers only listen on IPv4
    # loopback, and localhost can resolve to ::1 first.
    location /api/ {
        proxy_pass http://127.0.0.1:8110;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8111;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;

    server_name goals.kdubs.tech;

    include snippets/http-redirect.conf;
}
