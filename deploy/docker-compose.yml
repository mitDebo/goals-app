name: goals-app

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    image: ghcr.io/mitdebo/goals-app-backend:${BACKEND_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8110:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Goals: ${GOALS_DB_CONNECTION:?Set GOALS_DB_CONNECTION in .env}
    logging: *default-logging

  frontend:
    image: ghcr.io/mitdebo/goals-app-frontend:${FRONTEND_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8111:8080"
    logging: *default-logging
